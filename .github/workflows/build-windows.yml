name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

          python -m pip install pyinstaller

      - name: Check Python environment
        shell: pwsh
        run: |
          python --version
          python -m pip list

      - name: Build FuckGov.exe
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --noconsole `
            --name FuckGov `
            FuckGov.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\FuckGov.exe")) {
            throw "FuckGov.exe tidak berhasil dibuat."
          }

          $size = (Get-Item "dist\FuckGov.exe").Length / 1MB
          Write-Host ("FuckGov.exe size: {0:N2} MB" -f $size)

      - name: Upload FuckGov.exe
        uses: actions/upload-artifact@v4
        with:
          name: FuckGov-Windows-x64
          path: dist/FuckGov.exe
          if-no-files-found: error
